openapi: 3.0.3
info:
  title: ALEAN Corporate API
  version: 1.0.0
  description: 'Public API: /api/v1/public/... (Accept-Language / ?lang= az | ru |
    en).'
paths:
  /api/v1/about/:
    get:
      operationId: v1_about_retrieve
      description: «Haqqımızda» ictimai səhifəsi üçün bütün məlumatı tək cavabda qaytarır.
        'Biz kimik?', statistika, IATA, hekayə, missiya, vizyon, üstünlüklər ('Niyə
        ALEAN') və xronologiya ('Tariximiz') bloklarını əhatə edir.
      summary: Şirkət haqqında (Haqqımızda)
      parameters:
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - az
          - en
          - ru
        description: 'Dil. Accept-Language əvəzinə istifadə olunur (default: az)'
      tags:
      - About
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAbout'
          description: ''
  /api/v1/contact/:
    get:
      operationId: v1_contact_retrieve
      description: 'Əlaqə səhifəsinin bütün məlumatını qaytarır: başlıq, əlaqə kanalları
        (telefon, e-mail, ünvan və s.), form başlıqları və ofis kartı.'
      summary: Əlaqə səhifəsinin məlumatları
      parameters:
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - az
          - en
          - ru
        description: 'Dil. Accept-Language əvəzinə istifadə olunur (default: az)'
      tags:
      - Contact
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicContact'
          description: ''
    post:
      operationId: v1_contact_create
      description: İstifadəçi müraciətini qəbul edir. Spamdan qorunma var (gizli `website`
        sahəsi - honeypot).
      summary: Əlaqə formasından mesaj göndərilməsi
      parameters:
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - az
          - en
          - ru
        description: 'Dil. Accept-Language əvəzinə istifadə olunur (default: az)'
      tags:
      - Contact
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactMessageCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ContactMessageCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ContactMessageCreateRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          description: 'Müraciət uğurla qəbul edildi (`{ ''status'': ''received''
            }`).'
        '400':
          description: Göndərilən sahələrdə doğrulama xətası.
  /api/v1/event-categories/:
    get:
      operationId: v1_event_categories_list
      summary: Aktiv tədbir kateqoriyalarının siyahısı
      parameters:
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - az
          - en
          - ru
        description: 'Dil. Accept-Language əvəzinə istifadə olunur (default: az)'
      tags:
      - Events
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicCategory'
          description: ''
  /api/v1/events/:
    get:
      operationId: v1_events_list
      summary: Yayımlanmış tədbirlərin siyahısı
      parameters:
      - in: query
        name: category
        schema:
          type: string
        description: 'Kateqoriya slug (məs: konfrans)'
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - az
          - en
          - ru
        description: 'Dil. Accept-Language əvəzinə istifadə olunur (default: az)'
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Başlıq və ya məkan üzrə axtarış
      tags:
      - Events
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublicEventListList'
          description: ''
  /api/v1/events/{slug}/:
    get:
      operationId: v1_events_retrieve
      summary: Tədbirin təfərrüat səhifəsi
      parameters:
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - az
          - en
          - ru
        description: 'Dil. Accept-Language əvəzinə istifadə olunur (default: az)'
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Events
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEventDetail'
          description: ''
  /api/v1/events/{slug}/register/:
    post:
      operationId: v1_events_register_create
      summary: Tədbirə qeydiyyat
      parameters:
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - az
          - en
          - ru
        description: 'Dil. Accept-Language əvəzinə istifadə olunur (default: az)'
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegistrationCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegistrationCreateRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          description: 'Müraciət qəbul edildi (`{ ''id'': 1, ''status'': ''pending''
            }`)'
  /api/v1/events/{slug}/related/:
    get:
      operationId: v1_events_related_list
      summary: Oxşar / digər tədbirlər
      parameters:
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - az
          - en
          - ru
        description: 'Dil. Accept-Language əvəzinə istifadə olunur (default: az)'
      - in: query
        name: limit
        schema:
          type: integer
        description: 1-6 arası, defolt 3
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Events
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicEventList'
          description: ''
  /api/v1/home/:
    get:
      operationId: home_page
      description: |-
        GET /api/v1/public/home/?lang=az
        Ana səhifə - tək cavabda bütün bloklar (Hero, Haqqımızda, Xidmətlər,
        Tədbirlər, Xəbərlər, Partnyorlar).
      parameters:
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - az
          - en
          - ru
        description: 'Dil. Accept-Language əvəzinə istifadə olunur (default: az)'
      tags:
      - Home
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicHome'
          description: ''
  /api/v1/news/:
    get:
      operationId: v1_news_list
      description: Yayımlanmış xəbərləri kateqoriya, etiket (tag) və mətn üzrə filtrləyərək,
        səhifələmə (pagination) dəstəyi ilə qaytarır.
      summary: Xəbərlərin siyahısı
      parameters:
      - in: query
        name: category
        schema:
          type: string
        description: Kateqoriya slug-ı
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - az
          - en
          - ru
        description: 'Dil. Accept-Language əvəzinə istifadə olunur (default: az)'
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Başlıq və ya qısa məzmun üzrə axtarış
      - in: query
        name: tag
        schema:
          type: string
        description: Açar söz (tag) slug-ı
      tags:
      - News
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublicNewsListList'
          description: ''
  /api/v1/news-categories/:
    get:
      operationId: v1_news_categories_list
      description: Filtrləmə üçün aktiv xəbər kateqoriyalarının siyahısını qaytarır.
      summary: Xəbər kateqoriyaları
      parameters:
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - az
          - en
          - ru
        description: 'Dil. Accept-Language əvəzinə istifadə olunur (default: az)'
      tags:
      - News
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicNewsCategory'
          description: ''
  /api/v1/news-page/:
    get:
      operationId: v1_news_page_retrieve
      description: Xəbərlər bölməsinin başlığı üçün 'Title' və 'Subtitle' məlumatını
        qaytarır.
      summary: Xəbərlər səhifəsinin başlığı
      parameters:
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - az
          - en
          - ru
        description: 'Dil. Accept-Language əvəzinə istifadə olunur (default: az)'
      tags:
      - News
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicNewsPage'
          description: ''
  /api/v1/news/{slug}/:
    get:
      operationId: v1_news_retrieve
      description: '`slug` üzrə xəbərin tam məzmununu qaytarır.'
      summary: Xəbərin təfərrüatları (slug üzrə)
      parameters:
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - az
          - en
          - ru
        description: 'Dil. Accept-Language əvəzinə istifadə olunur (default: az)'
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - News
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicNewsDetail'
          description: ''
  /api/v1/partners/:
    get:
      operationId: v1_partners_list
      description: Bütün aktiv partnyorları (loqo, ad, təsvir, üstünlüklər) səhifələmə
        (pagination) və dil parametri (?lang=az|ru|en) ilə qaytarır.
      summary: Aktiv partnyorların siyahısı
      parameters:
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - az
          - en
          - ru
        description: 'Dil. Accept-Language əvəzinə istifadə olunur (default: az)'
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - Partners
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublicPartnerList'
          description: ''
  /api/v1/partners/page/:
    get:
      operationId: v1_partners_page_retrieve
      description: Səhifənin yuxarı hissəsindəki 'Title' və 'Subtitle' məlumatlarını
        qaytarır.
      summary: Partnyorlar səhifəsinin başlığı və alt başlığı
      parameters:
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - az
          - en
          - ru
        description: 'Dil. Accept-Language əvəzinə istifadə olunur (default: az)'
      tags:
      - Partners
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPartnersPage'
          description: ''
  /api/v1/services/:
    get:
      operationId: v1_services_retrieve
      description: Səhifə başlığını (Hero), sürətli keçid çiplərini və bütün aktiv
        xidmət bölmələrini müəyyən olunmuş sırada qaytarır.
      summary: Bütün xidmətlərə ümumi baxış (Xidmətlər səhifəsi)
      parameters:
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - az
          - en
          - ru
        description: 'Dil. Accept-Language əvəzinə istifadə olunur (default: az)'
      tags:
      - Services
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicesOverview'
          description: ''
  /api/v1/services/{key}/:
    get:
      operationId: v1_services_retrieve_2
      description: Konkret xidmət blokunun məlumatını qaytarır (`aviation`, `hotels`,
        `tours` və s.).
      summary: Ayrıca xidmətin təfərrüatları (key üzrə)
      parameters:
      - in: path
        name: key
        schema:
          type: string
        required: true
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - az
          - en
          - ru
        description: 'Dil. Accept-Language əvəzinə istifadə olunur (default: az)'
      tags:
      - Services
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicService'
          description: ''
        '404':
          description: Xidmət tapılmadı və ya aktiv deyil.
  /api/v1/site/:
    get:
      operationId: site_settings
      description: Footer mətnləri, əlaqə məlumatları və aktiv sosial şəbəkə linklərini
        qaytarır. Autentifikasiya tələb olunmur.
      summary: Sayt tənzimləmələri
      parameters:
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - az
          - en
          - ru
        description: 'Dil. Accept-Language əvəzinə istifadə olunur (default: az)'
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSite'
          description: ''
components:
  schemas:
    AboutBlock:
      type: object
      properties:
        eyebrow:
          type: string
        headline:
          type: string
        stats:
          type: array
          items:
            $ref: '#/components/schemas/Stat'
          readOnly: true
        iata:
          allOf:
          - $ref: '#/components/schemas/HomeIata'
          readOnly: true
      required:
      - eyebrow
      - headline
      - iata
      - stats
    Card:
      type: object
      description: API cavabındakı kart (number - 01, 02 ... sırayla əlavə olunur)
        - yalnız Swagger sxemi üçün.
      properties:
        title:
          type: string
        description:
          type: string
        image:
          type: string
          format: uri
          nullable: true
        number:
          type: string
      required:
      - description
      - number
      - title
    Channel:
      type: object
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/TypeEnum'
          title: Növ
        label:
          type: string
          title: Başlıq
          description: 'Məs: Telefon'
          maxLength: 80
        value:
          type: string
          title: Dəyər
          description: 'Məs: +994 77 218 0770'
          maxLength: 255
        note:
          type: string
          title: Qeyd
          description: 'Məs: Həftənin 7 günü, 24 saat'
          maxLength: 160
        href:
          type: string
          nullable: true
          readOnly: true
      required:
      - href
      - label
      - type
      - value
    Chip:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
      required:
      - key
      - label
    ContactMessageCreateRequest:
      type: object
      properties:
        first_name:
          type: string
          minLength: 1
          title: Ad
          maxLength: 100
        last_name:
          type: string
          title: Soyad
          maxLength: 100
        email:
          type: string
          format: email
          minLength: 1
          title: E-mail
          maxLength: 254
        phone:
          type: string
          title: Telefon
          maxLength: 32
        company:
          type: string
          title: Şirkət / Təşkilat
          maxLength: 255
        subject:
          type: string
          title: Mövzu
          maxLength: 255
        message:
          type: string
          minLength: 1
          title: Mesaj
          maxLength: 5000
        website:
          type: string
          writeOnly: true
      required:
      - email
      - first_name
      - message
    Cta:
      type: object
      properties:
        label:
          type: string
        url:
          type: string
      required:
      - label
      - url
    EventsBlock:
      type: object
      properties:
        eyebrow:
          type: string
        title:
          type: string
        subtitle:
          type: string
        note:
          type: string
        link_label:
          type: string
        categories:
          type: array
          items:
            $ref: '#/components/schemas/HomeEventCategory'
          readOnly: true
      required:
      - categories
      - eyebrow
      - link_label
      - note
      - subtitle
      - title
    FormInfo:
      type: object
      properties:
        title:
          type: string
          default: ''
        subtitle:
          type: string
          default: ''
    Hero:
      type: object
      properties:
        title:
          type: string
          default: ''
        subtitle:
          type: string
          default: ''
        badge:
          type: string
          default: ''
    HeroBlock:
      type: object
      properties:
        title:
          type: string
        subtitle:
          type: string
        image:
          type: string
          format: uri
          nullable: true
        cta:
          allOf:
          - $ref: '#/components/schemas/HomeCta'
          nullable: true
          readOnly: true
      required:
      - cta
      - image
      - subtitle
      - title
    HomeCta:
      type: object
      properties:
        label:
          type: string
        url:
          type: string
      required:
      - label
      - url
    HomeEventCategory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          description: 'Hero kartında başlıq. Məs: Konfrans'
          maxLength: 120
        short_description:
          type: string
          description: 'Hero kartındakı qısa mətn. Məs: Zal, texniki təchizat, qeydiyyat,
            tərcümə.'
          maxLength: 255
      required:
      - id
      - name
      - slug
    HomeIata:
      type: object
      properties:
        logo:
          type: string
          nullable: true
        caption:
          type: string
      required:
      - caption
      - logo
    HomePartner:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Ad
          description: 'Brend adı, dilə görə dəyişmir. Məs: Hilton Hotels & Resorts'
          maxLength: 200
        logo:
          type: string
          format: uri
          title: Loqo
      required:
      - id
      - logo
      - name
    Iata:
      type: object
      properties:
        logo:
          type: string
          format: uri
          nullable: true
        caption:
          type: string
        title:
          type: string
        description:
          type: string
        features:
          type: array
          items:
            $ref: '#/components/schemas/IataFeature'
      required:
      - caption
      - description
      - features
      - logo
      - title
    IataFeature:
      type: object
      properties:
        text:
          type: string
          title: Mətn
          description: 'Məs: Tam üzvlü agentlik'
          maxLength: 160
      required:
      - text
    Image:
      type: object
      properties:
        image:
          type: string
          format: uri
        alt:
          type: string
      required:
      - alt
      - image
    Mission:
      type: object
      properties:
        eyebrow:
          type: string
        title:
          type: string
        text:
          type: string
      required:
      - eyebrow
      - text
      - title
    NetworkEnum:
      enum:
      - facebook
      - instagram
      - linkedin
      - youtube
      - telegram
      - tiktok
      - x
      - whatsapp
      type: string
      description: |-
        * `facebook` - Facebook
        * `instagram` - Instagram
        * `linkedin` - LinkedIn
        * `youtube` - YouTube
        * `telegram` - Telegram
        * `tiktok` - TikTok
        * `x` - X (Twitter)
        * `whatsapp` - WhatsApp
    NewsBlock:
      type: object
      properties:
        eyebrow:
          type: string
        title:
          type: string
        subtitle:
          type: string
        link_label:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicNewsList'
          readOnly: true
      required:
      - eyebrow
      - items
      - link_label
      - subtitle
      - title
    Office:
      type: object
      description: |-
        Yan kart: telefon / e-mail / ünvan aktiv əlaqə kanallarından (ContactChannel) götürülür.
        Kanallarda göstərilməyibsə - avtomatik qlobal SiteSettings-dən götürülür.
      properties:
        image:
          type: string
          nullable: true
          readOnly: true
        name:
          type: string
          default: ''
        phone:
          type: string
          readOnly: true
        email:
          type: string
          readOnly: true
        address:
          type: string
          readOnly: true
        working_hours:
          type: string
